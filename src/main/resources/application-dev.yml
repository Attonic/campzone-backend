# Perfil de desenvolvimento (padrão). Banco do docker-compose.yml na porta 5433.
# As credenciais abaixo são só do PostgreSQL local do Docker, não são segredo.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/campzone}
    username: ${DB_USER:campzone}
    password: ${DB_PASSWORD:campzone}

logging:
  level:
    br.com.codeacle.campzone: DEBUG

# Tudo abaixo é só de desenvolvimento local e NÃO é segredo: nunca use estes valores fora do dev.
campzone:
  jwt:
    # NÃO é segredo: chave fixa só para dev (mínimo 32 bytes). Em prod vem de JWT_SECRET.
    segredo: dev-nao-e-segredo-campzone-jwt-hmac-sha256-0123456789
  admin:
    email: admin@campzone.dev
    senha: admin12345
  dev:
    organizador:
      email: organizador@campzone.dev
      senha: organizador123
