# Perfil de produção. DB_URL, DB_USER e DB_PASSWORD são obrigatórios e NÃO têm default:
# se faltar algum, a aplicação não sobe (falha rápida).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    show-sql: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

logging:
  level:
    root: INFO
    br.com.codeacle.campzone: INFO
