# Configuração comum a todos os perfis. Sem credenciais: elas ficam em application-dev.yml (Docker local)
# e em variáveis de ambiente (prod). NÃO há perfil padrão (ADR 0004): sem SPRING_PROFILES_ACTIVE a aplicação não sobe.
spring:
  application:
    name: campzone
  jpa:
    open-in-view: false
    hibernate:
      # Sem migrations (decisão do projeto): o schema vem das entidades.
      ddl-auto: update
    properties:
      hibernate:
        # O padrão (DROP_RECREATE_QUIETLY) derruba e recria as unique constraints a cada startup; com
        # RECREATE_QUIETLY só tenta criar as que faltam e ignora as que já existem.
        schema_update:
          unique_constraint_strategy: RECREATE_QUIETLY
