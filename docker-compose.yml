services:
  postgres:
    image: postgres:17
    container_name: campzone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campzone}
      POSTGRES_USER: ${POSTGRES_USER:-campzone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campzone}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - campzone-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campzone-pgdata:
